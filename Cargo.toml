[workspace]
resolver = "3"
members = ["crates/sim", "crates/game"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
glam = { version = "0.32", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = "0.12"

# Bevy is heavy: optimize dependencies even in dev builds, keep our code fast to compile.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
